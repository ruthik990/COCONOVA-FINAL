<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | COCONOVA</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <section class="auth-page">


        <!-- LEFT -->

        <div class="auth-brand">

            <a href="index.html" class="logo">
                🌴 COCONOVA
            </a>

            <h1>
                Join The<br>
                Green Future.
            </h1>

            <p>
                Create your COCONOVA account and explore premium
                cocopeat, coir fiber and sustainable machinery.
            </p>

        </div>


        <!-- RIGHT -->

        <div class="auth-container">

            <div class="auth-box">

                <h2>Create Account</h2>

                <p class="auth-subtitle">
                    Join COCONOVA today.
                </p>


                <div
                    id="authMessage"
                    class="auth-message"
                ></div>


                <form
                    id="signupForm"
                    class="auth-form"
                >


                    <div class="auth-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            id="signupName"
                            required
                        >

                    </div>


                    <div class="auth-group">

                        <label>Email Address</label>

                        <input
                            type="email"
                            id="signupEmail"
                            required
                        >

                    </div>


                    <div class="auth-group">

                        <label>Password</label>

                        <input
                            type="password"
                            id="signupPassword"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-btn"
                    >

                        Create Account

                    </button>


                </form>


                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </section>


    <script
        type="module"
        src="auth.js"
    ></script>

</body>

</html>
