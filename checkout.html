<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | COCONOVA</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a href="index.html" class="logo">
            🌴 COCONOVA
        </a>

        <nav class="nav-links">

            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="shop.html?category=machines">Machines</a>
            <a href="index.html#about">About</a>

        </nav>

<div class="nav-actions">

    <a href="account.html" class="icon-btn account-btn">
        <i class="fa-solid fa-user"></i>
    </a>

    <a href="cart.html" class="icon-btn cart-btn">

        <i class="fa-solid fa-cart-shopping"></i>

        <span class="cart-count">0</span>

    </a>

</div>

    </header>


    <!-- ================= CHECKOUT ================= -->

    <section class="checkout-section">

        <div class="checkout-container">


            <!-- PAGE HEADER -->

            <div class="checkout-header">

                <p class="section-tag">
                    SECURE CHECKOUT
                </p>

                <h1>
                    Complete Your Order
                </h1>

                <p>
                    Please provide your delivery details.
                </p>

            </div>


            <div class="checkout-layout">


                <!-- ================= FORM ================= -->

                <div class="checkout-form-container">

                    <form id="checkoutForm">


                        <!-- CUSTOMER DETAILS -->

                        <div class="form-section">

                            <h2>
                                <i class="fa-solid fa-user"></i>
                                Customer Details
                            </h2>


                            <div class="form-grid">


                                <div class="form-group">

                                    <label>
                                        Full Name *
                                    </label>

                                    <input
                                        type="text"
                                        id="fullName"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label>
                                        Email Address *
                                    </label>

                                    <input
                                        type="email"
                                        id="email"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label>
                                        Phone Number *
                                    </label>

                                    <input
                                        type="tel"
                                        id="phone"
                                        required
                                    >

                                </div>

                            </div>

                        </div>


                        <!-- DELIVERY ADDRESS -->

                        <div class="form-section">

                            <h2>
                                <i class="fa-solid fa-location-dot"></i>
                                Delivery Address
                            </h2>


                            <div class="form-grid">


                                <div class="form-group full-width">

                                    <label>
                                        Address *
                                    </label>

                                    <textarea
                                        id="address"
                                        rows="4"
                                        required
                                    ></textarea>

                                </div>


                                <div class="form-group">

                                    <label>
                                        City *
                                    </label>

                                    <input
                                        type="text"
                                        id="city"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label>
                                        State *
                                    </label>

                                    <input
                                        type="text"
                                        id="state"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label>
                                        Pincode *
                                    </label>

                                    <input
                                        type="text"
                                        id="pincode"
                                        required
                                    >

                                </div>

                            </div>

                        </div>


                        <!-- PAYMENT -->

                        <div class="form-section">

                            <h2>
                                <i class="fa-solid fa-credit-card"></i>
                                Payment Method
                            </h2>


                            <div class="payment-options">


                                <label class="payment-option">

                                    <input
                                        type="radio"
                                        name="payment"
                                        value="Cash on Delivery"
                                        checked
                                    >

                                    <div>

                                        <i class="fa-solid fa-truck"></i>

                                        <strong>
                                            Cash on Delivery
                                        </strong>

                                        <span>
                                            Pay when your order arrives
                                        </span>

                                    </div>

                                </label>


                                <label class="payment-option">

                                    <input
                                        type="radio"
                                        name="payment"
                                        value="Bank Transfer"
                                    >

                                    <div>

                                        <i class="fa-solid fa-building-columns"></i>

                                        <strong>
                                            Bank Transfer
                                        </strong>

                                        <span>
                                            Contact us for bank payment details
                                        </span>

                                    </div>

                                </label>


                                <label class="payment-option">

                                    <input
                                        type="radio"
                                        name="payment"
                                        value="Online Payment"
                                    >

                                    <div>

                                        <i class="fa-solid fa-mobile-screen"></i>

                                        <strong>
                                            Online Payment
                                        </strong>

                                        <span>
                                            Online payment integration coming soon
                                        </span>

                                    </div>

                                </label>


                            </div>

                        </div>


                        <button
                            type="submit"
                            class="place-order-btn"
                        >

                            <span>
                                Place Order
                            </span>

                            <i class="fa-solid fa-lock"></i>

                        </button>


                    </form>

                </div>



                <!-- ================= ORDER SUMMARY ================= -->

                <div class="checkout-summary">


                    <h2>
                        Your Order
                    </h2>


                    <div
                        id="checkoutItems"
                        class="checkout-items"
                    >

                        <!-- JavaScript loads items -->

                    </div>


                    <div class="checkout-summary-row">

                        <span>Subtotal</span>

                        <span id="subtotal">
                            ₹0
                        </span>

                    </div>


                    <div class="checkout-summary-row">

                        <span>Shipping</span>

                        <span id="shipping">
                            ₹0
                        </span>

                    </div>


                    <div class="checkout-total">

                        <span>Total</span>

                        <span id="total">
                            ₹0
                        </span>

                    </div>


                </div>


            </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-bottom">

            <p>
                © 2026 COCONOVA. All Rights Reserved.
            </p>

        </div>

    </footer>


  <script type="module" src="checkout.js"></script>

</body>

</html>
